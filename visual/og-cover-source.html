<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Onest:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; position:relative;
         font-family:'Onest',sans-serif; color:#fff; }
  .bg { position:absolute; inset:0; }
  .bg img { width:100%; height:100%; object-fit:cover; }
  .bg::after { content:''; position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(14,34,48,.94) 0%, rgba(14,34,48,.82) 46%, rgba(14,34,48,.34) 100%); }
  .wrap { position:relative; z-index:1; height:100%; display:flex; flex-direction:column;
          justify-content:center; padding:0 72px; }
  .kicker { font-family:'JetBrains Mono',monospace; font-size:19px; letter-spacing:.16em;
            text-transform:uppercase; color:#F2B441; margin-bottom:22px; }
  h1 { font-family:'Playfair Display',serif; font-size:76px; line-height:1.08; max-width:16ch; }
  h1 em { font-style:italic; color:#F2B441; }
  .lead { margin-top:24px; font-size:24px; color:rgba(255,255,255,.88); max-width:26ch; line-height:1.45; }
  .meta { position:absolute; left:72px; bottom:52px; display:flex; gap:26px; align-items:center;
          font-family:'JetBrains Mono',monospace; font-size:19px; color:rgba(255,255,255,.82); }
  .meta b { color:#E8734A; font-weight:500; }
  .rule { position:absolute; left:0; right:0; bottom:0; height:7px;
          background:linear-gradient(90deg,#F2B441,#E8734A 55%,#8E7AA6); }
</style>
</head>
<body>
  <div class="bg"><img src="../photos/hero-wide.webp" alt=""></div>
  <div class="wrap">
    <div class="kicker">Выездной тренинг Андрея Захаревича</div>
    <h1>Энергия моря<br>и <em>личной силы</em></h1>
    <div class="lead">7 дней у моря: снять выгорание и пересобрать стратегию</div>
  </div>
  <div class="meta"><span><b>20–27 августа 2026</b></span><span>Вардане, Сочи</span><span>ретрит-центр «Лето»</span></div>
  <div class="rule"></div>
</body>
</html>
