<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  /* Обложка 1200×630 в текущей системе лендинга.
     Ключевое правило: весь смысловой контент лежит в центральном
     квадрате 630×630 (.safe). Telegram и часть агрегаторов показывают
     ссылку маленьким квадратным превью и режут широкую картинку по
     центру — если текст прижат к левому краю, от него остаются огрызки. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; position:relative;
         font-family:'Onest',sans-serif; color:#F6F2EC; background:#22303A; }
  .bg { position:absolute; inset:0; overflow:hidden;
        filter:saturate(1.12) contrast(1.04) brightness(1.03); }
  .bg img { width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .scrim { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(34,48,58,.58) 0%, rgba(34,48,58,.28) 26%,
      rgba(34,48,58,.72) 58%, rgba(34,48,58,.92) 100%); }

  .safe { position:absolute; left:285px; top:0; width:630px; height:630px;
          display:flex; flex-direction:column; justify-content:center; align-items:center;
          text-align:center; padding:0 20px; }

  .brand { font-family:'Prata',serif; font-size:22px; letter-spacing:.01em; margin-bottom:26px; }
  .eb { font-weight:500; font-size:16px; letter-spacing:.1em; text-transform:uppercase;
        margin-bottom:20px; }
  h1 { font-family:'Prata',serif; font-weight:400; font-size:78px; line-height:1; letter-spacing:-.015em; }
  h1 i { display:block; font-style:normal; font-size:38px; line-height:1.2; margin-top:8px; opacity:.94; }
  .lead { margin-top:26px; font-size:21px; line-height:1.45; max-width:22ch; }
  .rule { width:88px; height:1px; background:rgba(246,242,236,.5); margin:30px 0 26px; }
  .date { font-weight:500; font-size:19px; letter-spacing:.06em; }
  .date b { color:#F2A93B; font-weight:500; }
</style>
</head>
<body>
  <div class="bg"><img src="../photos/r/g-shore.webp" alt=""></div>
  <div class="scrim"></div>
  <div class="safe">
    <div class="brand">Homo Unicum</div>
    <div class="eb">Вардане · Сочи</div>
    <h1>Энергия<i>моря и личной силы</i></h1>
    <div class="rule"></div>
    <div class="lead">Тренинг по энергоактивной психологии с Андреем Захаревичем</div>
    <div class="date" style="margin-top:22px;"><b>20—27 августа 2026</b> · 16 мест</div>
  </div>
</body>
</html>
